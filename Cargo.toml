[workspace]
resolver = "2"
members = [
    "chess_core",
    "chess_engine",
    "chess_cli",
    "chess_web",
    "chess_android",
    "nnue_trainer",
]
default-members = [
    "chess_core",
    "chess_engine",
    "chess_cli",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["Răzvan Filea"]
license = "GPL-3.0-only"

[workspace.dependencies]
chess_core = { path = "chess_core" }
chess_engine = { path = "chess_engine" }
fearless_simd = "1.2.0"

[profile.release]
codegen-units = 1
lto = "fat"
debug = true

[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.dev]
opt-level = 1
