name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (leave empty for a pre-release named after the commit)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: windows-x86_64-v2,     os: windows-latest,   target: x86_64-pc-windows-msvc,     cpu: x86-64-v2, ext: .exe, flags: "-C target-feature=+crt-static" }
          - { name: windows-x86_64-v3,     os: windows-latest,   target: x86_64-pc-windows-msvc,     cpu: x86-64-v3, ext: .exe, flags: "-C target-feature=+crt-static" }
          - { name: windows-x86_64-v4,     os: windows-latest,   target: x86_64-pc-windows-msvc,     cpu: x86-64-v4, ext: .exe, flags: "-C target-feature=+crt-static", no-smoke: true }
          - { name: linux-x86_64,          os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  universal: true }
          - { name: linux-aarch64,         os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, cpu: generic }
          - { name: macos-aarch64,         os: macos-latest,     target: aarch64-apple-darwin,       cpu: apple-m1 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Compile
        if: ${{ !matrix.universal }}
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }} ${{ matrix.flags }}
        run: |
          cargo build --locked --profile dist --target ${{ matrix.target }} --bin lucky_chess
          mkdir -p dist
          cp target/${{ matrix.target }}/dist/lucky_chess${{ matrix.ext }} dist/lucky-chess-${{ matrix.name }}${{ matrix.ext }}

      - name: Compile universal binary
        if: ${{ matrix.universal }}
        run: |
          mkdir -p dist
          scripts/build_universal.sh dist/lucky-chess-${{ matrix.name }}

      # GitHub runners don't reliably support AVX-512, so those builds are only compiled
      - name: Smoke test
        if: ${{ !matrix.no-smoke && !matrix.universal }}
        shell: bash
        run: ./dist/lucky-chess-${{ matrix.name }}${{ matrix.ext }} bench

      - name: Smoke test universal binary
        if: ${{ matrix.universal }}
        run: |
          bin=./dist/lucky-chess-${{ matrix.name }}
          expected=$("$bin" bench | awk '/Nodes searched/{print $4}')
          echo "auto: $expected nodes"
          for arch in x86_64_v2 x86_64_v3_nopext x86_64_v3; do
            nodes=$(LUCKY_CHESS_ARCH=$arch "$bin" bench | awk '/Nodes searched/{print $4}')
            echo "$arch: $nodes nodes"
            [ -n "$nodes" ] && [ "$nodes" = "$expected" ]
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum lucky-chess-* > SHA256SUMS.txt

      - name: Resolve Release Tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Lucky Chess ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/lucky-chess-*
            release-assets/SHA256SUMS.txt
